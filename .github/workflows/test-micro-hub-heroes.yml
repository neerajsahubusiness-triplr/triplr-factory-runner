name: Test Micro Hub Heroes

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Test 10 Micro Hub Heroes
        env:
          FACTORY_BASE_URL: ${{ secrets.FACTORY_BASE_URL }}
          FACTORY_TOKEN: ${{ secrets.FACTORY_TOKEN }}
        run: |
          python3 - <<'PY'
          import os
          import json
          import urllib.request
          import urllib.error

          base_url = os.environ["FACTORY_BASE_URL"].strip()
          token = os.environ["FACTORY_TOKEN"].strip()

          if not base_url.startswith(("http://", "https://")):
              base_url = "https://" + base_url

          base_url = base_url.rstrip("/")

          url = base_url + "/factory/enrich-hub-heroes-unsplash"

          payload = {
              "target_tier": "micro",
              "image_count": 2,
              "dry_run": True,
              "hub_ids": [
                  "fc067b61-14ec-4a65-9b74-f913cfa2601b",
                  "9af7d780-e642-4a51-94e4-e2f583c05f50",
                  "312409dd-46d5-4de2-af63-e66a98f1b4b5",
                  "bb1e1509-8329-4908-a49c-8827cc18c16e",
                  "bfc1f9e2-2715-47d6-a4f4-fb66a8fd1da6",
                  "48100ec5-7ad1-4277-86a0-45482e84189b",
                  "59c98f26-be4e-4401-8704-c2b522065ce7",
                  "3baad32c-cf6f-4b1e-8123-ea687b184efb",
                  "47368c3d-3a54-4902-9165-2c86407ab220",
                  "d4cd56a7-cc2d-4566-9bf2-1e15141ac6cf"
              ]
          }

          req = urllib.request.Request(
              url,
              data=json.dumps(payload).encode("utf-8"),
              headers={
    "Content-Type": "application/json",
    "Authorization": f"Bearer {token}",
    "User-Agent": "TRIPLR-Factory-Runner/1.0"
},
              method="POST"
          )

          try:
              with urllib.request.urlopen(req, timeout=120) as response:
                  body = response.read().decode("utf-8")
                  parsed = json.loads(body)
                  print(json.dumps(parsed, indent=2))

          except urllib.error.HTTPError as e:
              body = e.read().decode("utf-8")
              print("HTTP ERROR:", e.code)
              print("RESPONSE BODY:")
              print(body)

          except Exception as e:
              print("REQUEST ERROR:")
              print(repr(e))
          PY
