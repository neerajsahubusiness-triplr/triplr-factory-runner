name: Micro Hub Heroes

on:
  workflow_dispatch:
    inputs:
      batch_size:
        description: "Number of Micro hubs to process"
        required: true
        default: "5"
        type: string

jobs:
  micro-hub-heroes:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Enrich Micro Hub Heroes
        env:
          FACTORY_BASE_URL: ${{ secrets.FACTORY_BASE_URL }}
          FACTORY_TOKEN: ${{ secrets.FACTORY_TOKEN }}
          BATCH_SIZE: ${{ inputs.batch_size }}

        run: |
          python3 - <<'PY'
          import os
          import sys
          import json
          import urllib.request
          import urllib.error

          base_url = os.environ.get(
              "FACTORY_BASE_URL",
              ""
          ).strip()

          token = os.environ.get(
              "FACTORY_TOKEN",
              ""
          ).strip()

          try:
              batch_size = int(
                  os.environ.get(
                      "BATCH_SIZE",
                      "5"
                  )
              )
          except ValueError:
              print("ERROR: batch_size must be a whole number.")
              sys.exit(1)

          if not base_url:
              print("ERROR: FACTORY_BASE_URL secret is missing.")
              sys.exit(1)

          if not token:
              print("ERROR: FACTORY_TOKEN secret is missing.")
              sys.exit(1)

          if batch_size < 1:
              print("ERROR: batch_size must be at least 1.")
              sys.exit(1)

          if not base_url.startswith(("http://", "https://")):
              base_url = "https://" + base_url

          base_url = base_url.rstrip("/")

          endpoint = (
              base_url +
              "/factory/enrich-hub-heroes-unsplash"
          )

          payload = {
              "target_tier": "micro",
              "image_count": 2,
              "limit": batch_size,
              "dry_run": False,
              "overwrite": False
          }

          print()
          print("=" * 72)
          print("TRIPLR MICRO HUB HERO ENRICHMENT")
          print("=" * 72)
          print("Tier: micro")
          print("Batch size:", batch_size)
          print("Images per hub: 2")
          print("Dry run: False")
          print("Overwrite: False")
          print("=" * 72)

          request = urllib.request.Request(
              endpoint,
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Content-Type": "application/json",
                  "Authorization": f"Bearer {token}",
                  "User-Agent": "TRIPLR-Factory-Runner/1.0"
              },
              method="POST"
          )

          try:
              with urllib.request.urlopen(
                  request,
                  timeout=900
              ) as response:

                  status_code = response.getcode()
                  raw_body = response.read().decode("utf-8")

                  print()
                  print("HTTP STATUS:", status_code)

                  try:
                      result = json.loads(raw_body)
                  except json.JSONDecodeError:
                      print("ERROR: Worker returned non-JSON response.")
                      print(raw_body)
                      sys.exit(1)

                  print()
                  print("WORKER RESPONSE:")
                  print(
                      json.dumps(
                          result,
                          indent=2,
                          ensure_ascii=False
                      )
                  )

                  if result.get("ok") is False:
                      print("ERROR: Worker returned ok=false.")
                      sys.exit(1)

                  completed = int(
                      result.get("completed", 0) or 0
                  )

                  skipped = int(
                      result.get("skipped", 0) or 0
                  )

                  review = int(
                      result.get("review", 0) or 0
                  )

                  failed = int(
                      result.get("failed", 0) or 0
                  )

                  hubs_requested = int(
                      result.get("hubs_requested", 0) or 0
                  )

                  print()
                  print("=" * 72)
                  print("MICRO HUB HERO BATCH SUMMARY")
                  print("=" * 72)
                  print("Hubs requested:", hubs_requested)
                  print("Completed:", completed)
                  print("Skipped:", skipped)
                  print("Review:", review)
                  print("Failed:", failed)
                  print("=" * 72)

                  if failed > 0:
                      print("ERROR: One or more Micro hubs failed.")
                      sys.exit(1)

                  print()
                  print("Micro Hub Hero batch completed successfully.")

          except urllib.error.HTTPError as error:
              body = error.read().decode(
                  "utf-8",
                  errors="replace"
              )

              print()
              print("HTTP ERROR:", error.code)
              print(body)
              sys.exit(1)

          except urllib.error.URLError as error:
              print()
              print("CONNECTION ERROR:")
              print(repr(error))
              sys.exit(1)

          except Exception as error:
              print()
              print("REQUEST ERROR:")
              print(repr(error))
              sys.exit(1)

          PY
