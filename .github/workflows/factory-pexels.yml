name: Factory Pexels Enrichment Small

on:
  schedule:
    - cron: "37 * * * *"

  workflow_dispatch:
    inputs:
      hub_count:
        description: "Small hubs per parallel worker"
        required: true
        default: "3"

      activity_limit:
        description: "Activities per Worker call"
        required: true
        default: "20"

      max_calls_per_hub:
        description: "Maximum Worker calls per hub"
        required: true
        default: "35"

      pause_seconds:
        description: "Pause between calls"
        required: true
        default: "5"

      tiers:
        description: "Hub tiers, comma-separated"
        required: true
        default: "small"

      fixed_hub_id:
        description: "Optional fixed canonical hub ID — use only for single-worker testing"
        required: false
        default: ""

concurrency:
  group: factory-pexels-small-hourly
  cancel-in-progress: false

jobs:
  pexels-enrichment:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - worker_id: pexels-small-worker-1
            key_slot: 1
          - worker_id: pexels-small-worker-2
            key_slot: 2

    env:
      FACTORY_URL: https://triplr-factory.neeraj-sahu-business.workers.dev
      FACTORY_TOKEN: ${{ secrets.FACTORY_ADMIN_TOKEN }}
      WORKER_ID: ${{ matrix.worker_id }}
      PEXELS_KEY_SLOT: ${{ matrix.key_slot }}

    steps:
      - name: Complete Pexels Small hubs
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "schedule" ]; then
            HUB_COUNT="3"
            ACTIVITY_LIMIT="20"
            MAX_CALLS_PER_HUB="35"
            PAUSE_SECONDS="5"
            TIERS="small"
            FIXED_HUB_ID=""
          else
            HUB_COUNT="${{ inputs.hub_count }}"
            ACTIVITY_LIMIT="${{ inputs.activity_limit }}"
            MAX_CALLS_PER_HUB="${{ inputs.max_calls_per_hub }}"
            PAUSE_SECONDS="${{ inputs.pause_seconds }}"
            TIERS="${{ inputs.tiers }}"
            FIXED_HUB_ID="${{ inputs.fixed_hub_id }}"
          fi

          if ! [[ "$HUB_COUNT" =~ ^[1-9][0-9]*$ ]]; then
            echo "hub_count must be a positive integer."
            exit 1
          fi

          if ! [[ "$ACTIVITY_LIMIT" =~ ^[1-9][0-9]*$ ]]; then
            echo "activity_limit must be a positive integer."
            exit 1
          fi

          if ! [[ "$MAX_CALLS_PER_HUB" =~ ^[1-9][0-9]*$ ]]; then
            echo "max_calls_per_hub must be a positive integer."
            exit 1
          fi

          if ! [[ "$PAUSE_SECONDS" =~ ^[0-9]+$ ]]; then
            echo "pause_seconds must be zero or a positive integer."
            exit 1
          fi

          if ! [[ "$PEXELS_KEY_SLOT" =~ ^[12]$ ]]; then
            echo "PEXELS_KEY_SLOT must be 1 or 2."
            exit 1
          fi

          TIER_JSON=$(printf '%s' "$TIERS" \
            | tr ',' '\n' \
            | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' \
            | sed '/^$/d' \
            | jq -R . \
            | jq -s .)

          TIER_COUNT=$(echo "$TIER_JSON" | jq 'length')

          if [ "$TIER_COUNT" -eq 0 ]; then
            echo "At least one tier is required."
            exit 1
          fi

          echo "========================================"
          echo "PEXELS SMALL PARALLEL WORKER CONFIGURATION"
          echo "Worker ID: $WORKER_ID"
          echo "Pexels key slot: $PEXELS_KEY_SLOT"
          echo "Hub count for this worker: $HUB_COUNT"
          echo "Activity limit: $ACTIVITY_LIMIT"
          echo "Maximum calls per hub: $MAX_CALLS_PER_HUB"
          echo "Pause seconds: $PAUSE_SECONDS"
          echo "Tiers: $TIER_JSON"
          echo "Fixed hub ID: ${FIXED_HUB_ID:-none}"
          echo "========================================"

          if [ -n "$FIXED_HUB_ID" ] && [ "$PEXELS_KEY_SLOT" != "1" ]; then
            echo "Fixed hub testing runs only on worker 1."
            exit 0
          fi

          for HUB_NUMBER in $(seq 1 "$HUB_COUNT"); do
            echo ""
            echo "========================================"
            echo "Worker: $WORKER_ID"
            echo "Starting Small hub $HUB_NUMBER / $HUB_COUNT"
            echo "Key slot: $PEXELS_KEY_SLOT"
            echo "========================================"

            if [ -n "$FIXED_HUB_ID" ]; then
              CLAIM_BODY=$(jq -n \
                --arg hub_id "$FIXED_HUB_ID" \
                --argjson tiers "$TIER_JSON" \
                --arg worker_id "$WORKER_ID" \
                --argjson pexels_key_slot "$PEXELS_KEY_SLOT" \
                '{
                  hub_id: $hub_id,
                  tiers: $tiers,
                  worker_id: $worker_id,
                  pexels_key_slot: $pexels_key_slot
                }')
            else
              CLAIM_BODY=$(jq -n \
                --argjson tiers "$TIER_JSON" \
                --arg worker_id "$WORKER_ID" \
                --argjson pexels_key_slot "$PEXELS_KEY_SLOT" \
                '{
                  tiers: $tiers,
                  worker_id: $worker_id,
                  pexels_key_slot: $pexels_key_slot
                }')
            fi

            CLAIM_RESPONSE_FILE="pexels-small-claim-response-${PEXELS_KEY_SLOT}.json"

            CLAIM_HTTP_CODE=$(curl -sS \
              -o "$CLAIM_RESPONSE_FILE" \
              -w "%{http_code}" \
              -X POST \
              "$FACTORY_URL/factory/claim-pexels-hub" \
              -H "Content-Type: application/json" \
              -H "x-factory-token: $FACTORY_TOKEN" \
              --data "$CLAIM_BODY")

            echo "Claim HTTP status: $CLAIM_HTTP_CODE"
            echo "Claim response:"
            cat "$CLAIM_RESPONSE_FILE"
            echo ""

            if [ "$CLAIM_HTTP_CODE" -lt 200 ] || \
               [ "$CLAIM_HTTP_CODE" -ge 300 ]; then
              echo "Pexels hub claim failed."
              exit 1
            fi

            if ! jq empty "$CLAIM_RESPONSE_FILE" >/dev/null 2>&1; then
              echo "Claim response is not valid JSON."
              exit 1
            fi

            CLAIM_OK=$(jq -r \
              '.ok // false' \
              "$CLAIM_RESPONSE_FILE")

            if [ "$CLAIM_OK" != "true" ]; then
              echo "Pexels claim returned failure."
              exit 1
            fi

            NO_PENDING=$(jq -r \
              '.no_pending_hubs // false' \
              "$CLAIM_RESPONSE_FILE")

            if [ "$NO_PENDING" = "true" ]; then
              echo "No pending Small Pexels hubs found."
              exit 0
            fi

            HUB_ID=$(jq -r \
              '.hub_id // empty' \
              "$CLAIM_RESPONSE_FILE")

            HUB_NAME=$(jq -r \
              '.hub_name // "Unknown hub"' \
              "$CLAIM_RESPONSE_FILE")

            if [ -z "$HUB_ID" ]; then
              echo "Claim succeeded but returned no hub_id."
              exit 1
            fi

            echo ""
            echo "Locked Pexels Small hub:"
            echo "$HUB_NAME ($HUB_ID)"
            echo "Worker: $WORKER_ID"
            echo "Key slot: $PEXELS_KEY_SLOT"

            HUB_COMPLETE="false"
            COMPLETED="0"
            TOTAL="0"
            INCOMPLETE="0"
            FAILED="0"

            for CALL_NUMBER in $(seq 1 "$MAX_CALLS_PER_HUB"); do
              echo ""
              echo "----------------------------------------"
              echo "Pexels call $CALL_NUMBER / $MAX_CALLS_PER_HUB"
              echo "Worker: $WORKER_ID"
              echo "Key slot: $PEXELS_KEY_SLOT"
              echo "Hub: $HUB_ID"
              echo "Activity limit: $ACTIVITY_LIMIT"
              echo "----------------------------------------"

              BODY=$(jq -n \
                --arg hub_id "$HUB_ID" \
                --argjson activity_limit "$ACTIVITY_LIMIT" \
                --arg worker_id "$WORKER_ID" \
                --argjson pexels_key_slot "$PEXELS_KEY_SLOT" \
                '{
                  hub_id: $hub_id,
                  activity_limit: $activity_limit,
                  worker_id: $worker_id,
                  pexels_key_slot: $pexels_key_slot
                }')

              RESPONSE_FILE="pexels-small-response-${PEXELS_KEY_SLOT}.json"

              HTTP_CODE=$(curl -sS \
                -o "$RESPONSE_FILE" \
                -w "%{http_code}" \
                -X POST \
                "$FACTORY_URL/factory/enrich-next-pexels" \
                -H "Content-Type: application/json" \
                -H "x-factory-token: $FACTORY_TOKEN" \
                --data "$BODY")

              echo "HTTP status: $HTTP_CODE"
              echo "Pexels response:"
              cat "$RESPONSE_FILE"
              echo ""

              if [ "$HTTP_CODE" -lt 200 ] || \
                 [ "$HTTP_CODE" -ge 300 ]; then
                echo "Pexels Worker request failed."
                exit 1
              fi

              if ! jq empty "$RESPONSE_FILE" >/dev/null 2>&1; then
                echo "Pexels response is not valid JSON."
                exit 1
              fi

              OK=$(jq -r \
                '.ok // false' \
                "$RESPONSE_FILE")

              RESPONSE_KEY_SLOT=$(jq -r \
                '.pexels_key_slot // empty' \
                "$RESPONSE_FILE")

              RESPONSE_WORKER_ID=$(jq -r \
                '.worker_id // empty' \
                "$RESPONSE_FILE")

              HUB_COMPLETE=$(jq -r \
                '.hub_complete // false' \
                "$RESPONSE_FILE")

              COMPLETED=$(jq -r \
                '.completed_activities // 0' \
                "$RESPONSE_FILE")

              TOTAL=$(jq -r \
                '.total_activities // 0' \
                "$RESPONSE_FILE")

              INCOMPLETE=$(jq -r \
                '.incomplete_activities // 0' \
                "$RESPONSE_FILE")

              FAILED=$(jq -r \
                '.failed_activities // 0' \
                "$RESPONSE_FILE")

              if [ "$OK" != "true" ]; then
                echo "Pexels Worker returned failure."
                exit 1
              fi

              if [ "$RESPONSE_KEY_SLOT" != "$PEXELS_KEY_SLOT" ]; then
                echo "Wrong Pexels key slot returned."
                echo "Expected: $PEXELS_KEY_SLOT"
                echo "Received: ${RESPONSE_KEY_SLOT:-missing}"
                exit 1
              fi

              if [ -n "$RESPONSE_WORKER_ID" ] && \
                 [ "$RESPONSE_WORKER_ID" != "$WORKER_ID" ]; then
                echo "Wrong worker_id returned."
                exit 1
              fi

              echo "Worker: $WORKER_ID"
              echo "Confirmed key slot: $RESPONSE_KEY_SLOT"
              echo "Pexels progress: $COMPLETED / $TOTAL"
              echo "Incomplete activities: $INCOMPLETE"
              echo "Failed activities: $FAILED"

              if [ "$HUB_COMPLETE" = "true" ]; then
                echo ""
                echo "Pexels Small hub complete: $COMPLETED / $TOTAL"
                break
              fi

              sleep "$PAUSE_SECONDS"
            done

            if [ "$HUB_COMPLETE" != "true" ]; then
              echo ""
              echo "Pexels Small hub did not complete within $MAX_CALLS_PER_HUB calls."
              echo "Worker: $WORKER_ID"
              echo "Key slot: $PEXELS_KEY_SLOT"
              echo "Completed: $COMPLETED / $TOTAL"
              echo "Incomplete: $INCOMPLETE"
              echo "Failed: $FAILED"
              echo "The next hub will not be claimed."
              exit 1
            fi

            echo ""
            echo "========================================"
            echo "PEXELS SMALL HUB COMPLETE"
            echo "Worker: $WORKER_ID"
            echo "Key slot: $PEXELS_KEY_SLOT"
            echo "$HUB_NAME"
            echo "$HUB_ID"
            echo "Activities: $COMPLETED / $TOTAL"
            echo "Failed: $FAILED"
            echo "========================================"

            if [ -n "$FIXED_HUB_ID" ]; then
              echo "Fixed hub mode complete."
              exit 0
            fi
          done
