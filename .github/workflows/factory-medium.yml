name: Factory Selected Hubs

on:
  workflow_dispatch:
    inputs:
      target_tier:
        description: "Tier to run"
        required: true
        type: choice
        options:
          - micro
          - small
          - medium
          - large

      number_of_hubs:
        description: "Number of hubs to run"
        required: true
        default: "5"
        type: string

      pause_ms:
        description: "Pause between cluster batches"
        required: true
        default: "12000"

      max_steps_per_hub:
        description: "Maximum step calls per hub"
        required: true
        default: "25"

jobs:
  run-selected-hubs:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        worker: [1, 2, 3]

    steps:
      - name: Run Factory hubs
        shell: bash
        run: |
          set -euo pipefail

          TARGET_TIER="${{ github.event.inputs.target_tier }}"
          NUMBER_OF_HUBS="${{ github.event.inputs.number_of_hubs }}"
          PAUSE_MS="${{ github.event.inputs.pause_ms }}"
          MAX_STEPS="${{ github.event.inputs.max_steps_per_hub }}"

          WORKER_NUMBER="${{ matrix.worker }}"
          WORKER_COUNT=3

          echo "======================================"
          echo "Factory Selected Hubs"
          echo "Tier: $TARGET_TIER"
          echo "Total requested hubs: $NUMBER_OF_HUBS"
          echo "Worker: $WORKER_NUMBER / $WORKER_COUNT"
          echo "Max steps per hub: $MAX_STEPS"
          echo "Pause: ${PAUSE_MS}ms"
          echo "======================================"

          # Validate number of hubs.
          if ! [[ "$NUMBER_OF_HUBS" =~ ^[1-9][0-9]*$ ]]; then
            echo "number_of_hubs must be a positive integer."
            exit 1
          fi

          # Validate pause.
          if ! [[ "$PAUSE_MS" =~ ^[0-9]+$ ]]; then
            echo "pause_ms must be a non-negative integer."
            exit 1
          fi

          # Validate max steps.
          if ! [[ "$MAX_STEPS" =~ ^[1-9][0-9]*$ ]]; then
            echo "max_steps_per_hub must be a positive integer."
            exit 1
          fi

          # ------------------------------------------------------------
          # DISTRIBUTE REQUESTED HUBS ACROSS 3 WORKERS
          #
          # 5 hubs  -> 2 / 2 / 1
          # 10 hubs -> 4 / 3 / 3
          # ------------------------------------------------------------

          BASE=$((NUMBER_OF_HUBS / WORKER_COUNT))
          REMAINDER=$((NUMBER_OF_HUBS % WORKER_COUNT))

          HUBS_FOR_WORKER="$BASE"

          if [ "$WORKER_NUMBER" -le "$REMAINDER" ]; then
            HUBS_FOR_WORKER=$((HUBS_FOR_WORKER + 1))
          fi

          echo "Worker $WORKER_NUMBER assigned $HUBS_FOR_WORKER hub(s)."

          if [ "$HUBS_FOR_WORKER" -eq 0 ]; then
            echo "Nothing assigned to Worker $WORKER_NUMBER."
            exit 0
          fi

          COMPLETED_COUNT=0
          PARKED_COUNT=0

          # ------------------------------------------------------------
          # PROCESS EACH HUB ASSIGNED TO THIS WORKER
          # ------------------------------------------------------------

          for hub_num in $(seq 1 "$HUBS_FOR_WORKER"); do

            echo ""
            echo "======================================"
            echo "Worker $WORKER_NUMBER"
            echo "Claiming hub $hub_num of $HUBS_FOR_WORKER"
            echo "Tier: $TARGET_TIER"
            echo "======================================"

            HUB_ID=""
            HUB_STATE="running"
            NON_JSON_RETRIES=0

            for step_num in $(seq 1 "$MAX_STEPS"); do

              echo ""
              echo "Worker $WORKER_NUMBER | Hub slot $hub_num | Step $step_num"

              # --------------------------------------------------------
              # FIRST CALL:
              # No hub ID supplied. Factory claims an eligible hub
              # from the requested tier.
              # --------------------------------------------------------

              if [ -z "$HUB_ID" ]; then

                PAYLOAD=$(jq -n \
                  --arg target_tier "$TARGET_TIER" \
                  --argjson pause_ms "$PAUSE_MS" \
                  '{
                    target_tier: $target_tier,
                    pause_ms: $pause_ms
                  }')

              else

                # ------------------------------------------------------
                # AFTER CLAIM:
                # Pin every subsequent call to the exact same hub.
                # ------------------------------------------------------

                PAYLOAD=$(jq -n \
                  --arg factory_hub_id "$HUB_ID" \
                  --arg target_tier "$TARGET_TIER" \
                  --argjson pause_ms "$PAUSE_MS" \
                  '{
                    factory_hub_id: $factory_hub_id,
                    target_tier: $target_tier,
                    pause_ms: $pause_ms
                  }')

              fi

              RESPONSE=$(curl \
                --silent \
                --show-error \
                --max-time 240 \
                -X POST \
                "$FACTORY_URL/factory/run-next-hub-step" \
                -H "content-type: application/json" \
                -H "x-factory-token: $FACTORY_TOKEN" \
                -d "$PAYLOAD" \
                || true)

              echo "$RESPONSE" | jq . 2>/dev/null || echo "$RESPONSE"

              # --------------------------------------------------------
              # CLOUDFLARE / TRANSIENT NON-JSON RESPONSE
              #
              # Retry up to 3 times before parking the hub slot.
              # --------------------------------------------------------

              if ! echo "$RESPONSE" | jq empty >/dev/null 2>&1; then

                NON_JSON_RETRIES=$((NON_JSON_RETRIES + 1))

                echo ""
                echo "Non-JSON response."
                echo "Transient retry: $NON_JSON_RETRIES / 3"

                if [ "$NON_JSON_RETRIES" -ge 3 ]; then
                  echo ""
                  echo "======================================"
                  echo "PARKING HUB SLOT"
                  echo "Reason: 3 consecutive non-JSON responses"
                  echo "Factory hub ID: ${HUB_ID:-not-yet-claimed}"
                  echo "======================================"

                  HUB_STATE="parked"
                  break
                fi

                sleep 30
                continue
              fi

              # Successful JSON response resets transient counter.
              NON_JSON_RETRIES=0

              RESPONSE_HUB_ID=$(echo "$RESPONSE" | jq -r \
                '.factory_hub_id // .result.factory_hub_id // empty'
              )

              # --------------------------------------------------------
              # CAPTURE AUTO-CLAIMED HUB ID
              # --------------------------------------------------------

              if [ -z "$HUB_ID" ]; then

                if [ -z "$RESPONSE_HUB_ID" ]; then
                  echo ""
                  echo "======================================"
                  echo "PARKING HUB SLOT"
                  echo "Factory returned no factory_hub_id."
                  echo "Cannot safely continue this slot."
                  echo "======================================"

                  HUB_STATE="parked"
                  break
                fi

                HUB_ID="$RESPONSE_HUB_ID"

                echo ""
                echo "CLAIMED FACTORY HUB: $HUB_ID"

              else

                # ------------------------------------------------------
                # SAFETY:
                # Once a hub is claimed, Factory cannot switch hubs.
                # This remains a hard safety failure.
                # ------------------------------------------------------

                if [ -n "$RESPONSE_HUB_ID" ] &&
                   [ "$RESPONSE_HUB_ID" != "$HUB_ID" ]; then

                  echo ""
                  echo "======================================"
                  echo "SAFETY FAILURE"
                  echo "Expected hub: $HUB_ID"
                  echo "Worker returned hub: $RESPONSE_HUB_ID"
                  echo "======================================"

                  exit 1
                fi

              fi

              # --------------------------------------------------------
              # HUB COMPLETE
              # --------------------------------------------------------

              if echo "$RESPONSE" | jq -e '.hub_done == true' >/dev/null; then

                echo ""
                echo "======================================"
                echo "HUB COMPLETED"
                echo "Factory hub ID: $HUB_ID"
                echo "======================================"

                HUB_STATE="completed"
                break
              fi

              # --------------------------------------------------------
              # FACTORY / OPENAI FAILURE
              #
              # Example:
              # - cluster exhausted below minimum 6
              # - OpenAI returned no activities
              # - validation failure
              #
              # PARK THIS HUB AND CONTINUE TO NEXT HUB.
              # --------------------------------------------------------

              if echo "$RESPONSE" | jq -e '.ok != true' >/dev/null; then

                ERROR_MESSAGE=$(echo "$RESPONSE" | jq -r \
                  '.error // .result.error // .message // "Unknown Worker failure"'
                )

                echo ""
                echo "======================================"
                echo "PARKING HUB"
                echo "Factory hub ID: $HUB_ID"
                echo "Reason: $ERROR_MESSAGE"
                echo "======================================"

                HUB_STATE="parked"
                break
              fi

              sleep $((PAUSE_MS / 1000))

            done

            # ----------------------------------------------------------
            # FINAL STATE FOR THIS HUB
            # ----------------------------------------------------------

            if [ "$HUB_STATE" = "completed" ]; then

              COMPLETED_COUNT=$((COMPLETED_COUNT + 1))

              echo ""
              echo "Worker $WORKER_NUMBER completed hub $hub_num of $HUBS_FOR_WORKER."
              echo "Factory hub ID: $HUB_ID"

            elif [ "$HUB_STATE" = "parked" ]; then

              PARKED_COUNT=$((PARKED_COUNT + 1))

              echo ""
              echo "Worker $WORKER_NUMBER parked hub $hub_num of $HUBS_FOR_WORKER."
              echo "Factory hub ID: ${HUB_ID:-not-claimed}"
              echo "Continuing to next hub."

            else

              # Max steps reached without hub_done or explicit failure.
              PARKED_COUNT=$((PARKED_COUNT + 1))

              echo ""
              echo "======================================"
              echo "PARKING HUB"
              echo "Reason: Maximum $MAX_STEPS steps reached"
              echo "Factory hub ID: ${HUB_ID:-not-claimed}"
              echo "======================================"
              echo "Continuing to next hub."

            fi

          done

          # ------------------------------------------------------------
          # WORKER SUMMARY
          # ------------------------------------------------------------

          echo ""
          echo "======================================"
          echo "WORKER $WORKER_NUMBER FINISHED"
          echo "Assigned:  $HUBS_FOR_WORKER"
          echo "Completed: $COMPLETED_COUNT"
          echo "Parked:    $PARKED_COUNT"
          echo "======================================"

          # IMPORTANT:
          # Parked catalogue hubs do NOT fail the GitHub job.
          # They can be repaired/re-run after bulk generation.

          exit 0

        env:
          FACTORY_URL: ${{ secrets.FACTORY_URL }}
          FACTORY_TOKEN: ${{ secrets.FACTORY_TOKEN }}
