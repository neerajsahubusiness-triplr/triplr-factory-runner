name: Factory Selected Hubs

on:
  workflow_dispatch:
    inputs:
      target_tier:
        description: "Tier for these hubs"
        required: true
        type: choice
        options:
          - micro
          - small
          - medium
          - large

      factory_hub_ids:
        description: "Factory hub IDs — one per line or comma-separated"
        required: true
        type: string

      number_of_hubs:
        description: "Number of hubs to run from the supplied list"
        required: true
        default: "5"
        type: string

      pause_ms:
        description: "Pause between cluster batches"
        required: true
        default: "12000"

      max_steps_per_hub:
        description: "Maximum step calls per hub"
        required: true
        default: "25"

jobs:
  run-selected-hubs:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        worker: [1, 2, 3]

    steps:
      - name: Run selected Factory hubs
        shell: bash
        run: |
          set -euo pipefail

          TARGET_TIER="${{ github.event.inputs.target_tier }}"
          NUMBER_OF_HUBS="${{ github.event.inputs.number_of_hubs }}"
          PAUSE_MS="${{ github.event.inputs.pause_ms }}"
          MAX_STEPS="${{ github.event.inputs.max_steps_per_hub }}"
          WORKER_NUMBER="${{ matrix.worker }}"
          WORKER_COUNT=3

          RAW_HUB_IDS='${{ github.event.inputs.factory_hub_ids }}'

          echo "======================================"
          echo "Factory Selected Hubs"
          echo "Tier: $TARGET_TIER"
          echo "Requested hubs: $NUMBER_OF_HUBS"
          echo "Worker: $WORKER_NUMBER / $WORKER_COUNT"
          echo "Max steps per hub: $MAX_STEPS"
          echo "Pause: ${PAUSE_MS}ms"
          echo "======================================"

          # Validate number_of_hubs.
          if ! [[ "$NUMBER_OF_HUBS" =~ ^[1-9][0-9]*$ ]]; then
            echo "number_of_hubs must be a positive integer."
            exit 1
          fi

          # Accept comma-separated IDs or one ID per line.
          mapfile -t SUPPLIED_HUB_IDS < <(
            printf '%s\n' "$RAW_HUB_IDS" |
            tr ',' '\n' |
            sed 's/^[[:space:]]*//;s/[[:space:]]*$//' |
            grep -E '^[0-9a-fA-F-]{36}$'
          )

          SUPPLIED_TOTAL="${#SUPPLIED_HUB_IDS[@]}"

          if [ "$SUPPLIED_TOTAL" -eq 0 ]; then
            echo "No valid Factory hub IDs supplied."
            exit 1
          fi

          if [ "$NUMBER_OF_HUBS" -gt "$SUPPLIED_TOTAL" ]; then
            echo "Requested $NUMBER_OF_HUBS hubs but only $SUPPLIED_TOTAL valid IDs were supplied."
            exit 1
          fi

          # Take only the requested number BEFORE distributing to workers.
          ALL_HUB_IDS=("${SUPPLIED_HUB_IDS[@]:0:$NUMBER_OF_HUBS}")

          TOTAL_HUBS="${#ALL_HUB_IDS[@]}"

          echo "Valid supplied hub IDs: $SUPPLIED_TOTAL"
          echo "Hubs selected for this run: $TOTAL_HUBS"

          ASSIGNED_COUNT=0

          for index in "${!ALL_HUB_IDS[@]}"; do
            HUB_ID="${ALL_HUB_IDS[$index]}"

            # Distribute selected hubs across the three workers.
            ASSIGNED_WORKER=$(( (index % WORKER_COUNT) + 1 ))

            if [ "$ASSIGNED_WORKER" -ne "$WORKER_NUMBER" ]; then
              continue
            fi

            ASSIGNED_COUNT=$((ASSIGNED_COUNT + 1))
            HUB_COMPLETED="false"

            echo ""
            echo "======================================"
            echo "Worker $WORKER_NUMBER"
            echo "Factory hub ID: $HUB_ID"
            echo "Tier: $TARGET_TIER"
            echo "======================================"

            for step_num in $(seq 1 "$MAX_STEPS"); do
              echo ""
              echo "Worker $WORKER_NUMBER | Hub $HUB_ID | Step $step_num"

              PAYLOAD=$(jq -n \
                --arg factory_hub_id "$HUB_ID" \
                --arg target_tier "$TARGET_TIER" \
                --argjson pause_ms "$PAUSE_MS" \
                '{
                  factory_hub_id: $factory_hub_id,
                  target_tier: $target_tier,
                  pause_ms: $pause_ms
                }')

              RESPONSE=$(curl \
                --silent \
                --show-error \
                --max-time 240 \
                -X POST \
                "$FACTORY_URL/factory/run-next-hub-step" \
                -H "content-type: application/json" \
                -H "x-factory-token: $FACTORY_TOKEN" \
                -d "$PAYLOAD" \
                || true)

              echo "$RESPONSE" | jq . 2>/dev/null || echo "$RESPONSE"

              if ! echo "$RESPONSE" | jq empty >/dev/null 2>&1; then
                echo "Non-JSON response. Retrying after 30 seconds."
                sleep 30
                continue
              fi

              RESPONSE_HUB_ID=$(echo "$RESPONSE" | jq -r \
                '.factory_hub_id // .result.factory_hub_id // empty'
              )

              if [ -n "$RESPONSE_HUB_ID" ] &&
                 [ "$RESPONSE_HUB_ID" != "$HUB_ID" ]; then
                echo "Safety failure: requested $HUB_ID but Worker returned $RESPONSE_HUB_ID"
                exit 1
              fi

              if echo "$RESPONSE" | jq -e '.hub_done == true' >/dev/null; then
                echo "Hub completed: $HUB_ID"
                HUB_COMPLETED="true"
                break
              fi

              if echo "$RESPONSE" | jq -e '.ok != true' >/dev/null; then
                ERROR_MESSAGE=$(echo "$RESPONSE" | jq -r \
                  '.error // .result.error // .message // "Unknown Worker failure"'
                )

                echo "Worker failed for hub $HUB_ID: $ERROR_MESSAGE"
                exit 1
              fi

              sleep $((PAUSE_MS / 1000))
            done

            if [ "$HUB_COMPLETED" != "true" ]; then
              echo "Hub did not complete within $MAX_STEPS steps."
              echo "Factory hub ID: $HUB_ID"
              exit 1
            fi
          done

          if [ "$ASSIGNED_COUNT" -eq 0 ]; then
            echo "No hubs assigned to Worker $WORKER_NUMBER."
          else
            echo ""
            echo "Worker $WORKER_NUMBER completed $ASSIGNED_COUNT assigned hubs."
          fi

        env:
          FACTORY_URL: ${{ secrets.FACTORY_URL }}
          FACTORY_TOKEN: ${{ secrets.FACTORY_TOKEN }}
