name: Factory Mega Large Image Backfill

on:
  workflow_dispatch:
    inputs:
      target_tier:
        description: "Repair tier: mega or large"
        required: true
        default: "large"
        type: choice
        options:
          - large
          - mega

      hub_count:
        description: "How many repair hubs to fully complete"
        required: true
        default: "10"

      activity_limit:
        description: "Activities per Worker call"
        required: true
        default: "4"

      max_calls_per_hub:
        description: "Maximum Worker calls per hub"
        required: true
        default: "25"

      pause_seconds:
        description: "Pause between calls"
        required: true
        default: "8"

      factory_hub_id:
        description: "Optional fixed repair Factory hub ID"
        required: false
        default: ""

concurrency:
  group: factory-mega-large-image-backfill-${{ inputs.target_tier }}
  cancel-in-progress: false

jobs:
  enrich-images:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    env:
      FACTORY_URL: https://triplr-factory.neeraj-sahu-business.workers.dev
      FACTORY_TOKEN: ${{ secrets.FACTORY_ADMIN_TOKEN }}

    steps:
      - name: Complete Mega Large repair hub images
        shell: bash
        run: |
          set -euo pipefail

          HUB_COUNT="${{ inputs.hub_count }}"
          ACTIVITY_LIMIT="${{ inputs.activity_limit }}"
          MAX_CALLS_PER_HUB="${{ inputs.max_calls_per_hub }}"
          PAUSE_SECONDS="${{ inputs.pause_seconds }}"
          TARGET_TIER="${{ inputs.target_tier }}"
          FIXED_FACTORY_HUB_ID="${{ inputs.factory_hub_id }}"

          # =====================================================
          # INPUT VALIDATION
          # =====================================================

          if ! [[ "$HUB_COUNT" =~ ^[1-9][0-9]*$ ]]; then
            echo "hub_count must be a positive integer."
            exit 1
          fi

          if ! [[ "$ACTIVITY_LIMIT" =~ ^[1-9][0-9]*$ ]]; then
            echo "activity_limit must be a positive integer."
            exit 1
          fi

          if ! [[ "$MAX_CALLS_PER_HUB" =~ ^[1-9][0-9]*$ ]]; then
            echo "max_calls_per_hub must be a positive integer."
            exit 1
          fi

          if ! [[ "$PAUSE_SECONDS" =~ ^[0-9]+$ ]]; then
            echo "pause_seconds must be zero or a positive integer."
            exit 1
          fi

          if [ "$TARGET_TIER" != "mega" ] && \
             [ "$TARGET_TIER" != "large" ]; then
            echo "target_tier must be mega or large."
            exit 1
          fi

          echo ""
          echo "========================================"
          echo "MEGA / LARGE IMAGE BACKFILL"
          echo "Target tier: $TARGET_TIER"
          echo "Hub count: $HUB_COUNT"
          echo "Activity limit: $ACTIVITY_LIMIT"
          echo "Maximum calls per hub: $MAX_CALLS_PER_HUB"
          echo "Pause seconds: $PAUSE_SECONDS"
          echo "Fixed Factory hub: ${FIXED_FACTORY_HUB_ID:-none}"
          echo "========================================"


          # =====================================================
          # PROCESS HUBS
          # =====================================================

          for HUB_NUMBER in $(seq 1 "$HUB_COUNT"); do

            echo ""
            echo "========================================"
            echo "Starting $TARGET_TIER repair hub"
            echo "$HUB_NUMBER / $HUB_COUNT"
            echo "========================================"

            # ===================================================
            # FIXED HUB OR AUTO CLAIM
            # ===================================================

            if [ -n "$FIXED_FACTORY_HUB_ID" ]; then

              FACTORY_HUB_ID="$FIXED_FACTORY_HUB_ID"
              HUB_NAME="Fixed repair hub"

              echo "Using fixed Factory hub ID:"
              echo "$FACTORY_HUB_ID"

            else

              CLAIM_BODY=$(jq -n \
                --arg target_tier "$TARGET_TIER" \
                '{
                  target_tier: $target_tier
                }')

              CLAIM_HTTP_CODE=$(curl -sS \
                --connect-timeout 30 \
                --max-time 120 \
                -o claim-response.json \
                -w "%{http_code}" \
                -X POST \
                "$FACTORY_URL/factory/claim-image-hub" \
                -H "Content-Type: application/json" \
                -H "x-factory-token: $FACTORY_TOKEN" \
                --data "$CLAIM_BODY")

              echo "Claim HTTP status: $CLAIM_HTTP_CODE"
              echo "Claim response:"
              cat claim-response.json
              echo ""

              if [ "$CLAIM_HTTP_CODE" -lt 200 ] || \
                 [ "$CLAIM_HTTP_CODE" -ge 300 ]; then
                echo "Claim endpoint failed."
                exit 1
              fi

              if ! jq empty claim-response.json >/dev/null 2>&1; then
                echo "Claim endpoint did not return valid JSON."
                exit 1
              fi

              CLAIM_OK=$(jq -r \
                '.ok // false' \
                claim-response.json)

              if [ "$CLAIM_OK" != "true" ]; then
                echo "Repair hub claim failed."
                exit 1
              fi

              FACTORY_HUB_ID=$(jq -r \
                '.factory_hub_id // empty' \
                claim-response.json)

              HUB_NAME=$(jq -r \
                '.hub_name // "Unknown repair hub"' \
                claim-response.json)

              if [ -z "$FACTORY_HUB_ID" ]; then
                echo ""
                echo "No pending $TARGET_TIER image repair hubs remain."
                exit 0
              fi
            fi


            echo ""
            echo "Locked $TARGET_TIER repair hub:"
            echo "$HUB_NAME"
            echo "$FACTORY_HUB_ID"


            # ===================================================
            # HUB PROCESSING STATE
            # ===================================================

            HUB_COMPLETE="false"
            COMPLETE_COUNT="0"
            INCOMPLETE_COUNT="0"
            TOTAL_COUNT="0"
            SUCCESSFUL_CALLS="0"
            SUBREQUEST_RETRIES="0"


            # ===================================================
            # PROCESS ACTIVITIES UNTIL HUB COMPLETE
            # ===================================================

            for CALL_NUMBER in $(seq 1 "$MAX_CALLS_PER_HUB"); do

              echo ""
              echo "----------------------------------------"
              echo "Image call $CALL_NUMBER / $MAX_CALLS_PER_HUB"
              echo "Tier: $TARGET_TIER"
              echo "Factory hub: $FACTORY_HUB_ID"
              echo "Activity limit: $ACTIVITY_LIMIT"
              echo "----------------------------------------"


              BODY=$(jq -n \
                --arg target_tier "$TARGET_TIER" \
                --arg factory_hub_id "$FACTORY_HUB_ID" \
                --argjson activity_limit "$ACTIVITY_LIMIT" \
                '{
                  target_tier: $target_tier,
                  hub_limit: 1,
                  activity_limit: $activity_limit,
                  factory_hub_id: $factory_hub_id
                }')


              HTTP_CODE=$(curl -sS \
                --connect-timeout 30 \
                --max-time 300 \
                -o image-response.json \
                -w "%{http_code}" \
                -X POST \
                "$FACTORY_URL/factory/enrich-next-images" \
                -H "Content-Type: application/json" \
                -H "x-factory-token: $FACTORY_TOKEN" \
                --data "$BODY")


              echo "Image HTTP status: $HTTP_CODE"
              echo "Image response:"
              cat image-response.json
              echo ""


              # =================================================
              # HTTP FAILURE
              # =================================================

              if [ "$HTTP_CODE" -lt 200 ] || \
                 [ "$HTTP_CODE" -ge 300 ]; then

                ERROR_TEXT=$(jq -r \
                  '.error // "Unknown Worker error"' \
                  image-response.json 2>/dev/null || \
                  echo "Unknown Worker error")

                echo "Image endpoint failed:"
                echo "$ERROR_TEXT"

                if echo "$ERROR_TEXT" | grep -qi \
                  "Too many subrequests"; then

                  SUBREQUEST_RETRIES=$((SUBREQUEST_RETRIES + 1))

                  echo ""
                  echo "Cloudflare subrequest limit reached."
                  echo "Retry $SUBREQUEST_RETRIES / 5"

                  if [ "$SUBREQUEST_RETRIES" -ge 5 ]; then
                    echo "Too many consecutive subrequest failures."
                    exit 1
                  fi

                  echo "Waiting 30 seconds..."
                  sleep 30
                  continue
                fi

                echo "Non-retryable image endpoint failure."
                exit 1
              fi


              # =================================================
              # JSON VALIDATION
              # =================================================

              if ! jq empty image-response.json >/dev/null 2>&1; then
                echo "Image endpoint returned invalid JSON."
                exit 1
              fi


              OK=$(jq -r \
                '.ok // false' \
                image-response.json)

              if [ "$OK" != "true" ]; then

                ERROR_TEXT=$(jq -r \
                  '.error // "Image Worker returned failure"' \
                  image-response.json)

                echo "$ERROR_TEXT"
                exit 1
              fi


              SUBREQUEST_RETRIES="0"
              SUCCESSFUL_CALLS=$((SUCCESSFUL_CALLS + 1))


              # =================================================
              # READ WORKER PROGRESS
              # =================================================

              HUB_COMPLETE=$(jq -r \
                '.hub_complete // false' \
                image-response.json)

              COMPLETE_COUNT=$(jq -r \
                '.image_complete_count // 0' \
                image-response.json)

              INCOMPLETE_COUNT=$(jq -r \
                '.image_incomplete_count // 0' \
                image-response.json)

              TOTAL_COUNT=$((COMPLETE_COUNT + INCOMPLETE_COUNT))

              PROCESSED_COUNT=$(jq -r \
                '.total_processed // 0' \
                image-response.json)

              SUCCESS_COUNT=$(jq -r \
                '.total_success // 0' \
                image-response.json)

              FAILED_COUNT=$(jq -r \
                '.total_failed // 0' \
                image-response.json)

              PICKED_COUNT=$(jq -r \
                '.hubs[0].picked // 0' \
                image-response.json)

              PENDING_COUNT=$(jq -r \
                '.hubs[0].pending_count // 0' \
                image-response.json)

              ACTIVITY_FAILED_COUNT=$(jq -r \
                '.hubs[0].failed_count // 0' \
                image-response.json)


              echo ""
              echo "Successful Worker calls: $SUCCESSFUL_CALLS"
              echo "Processed this call: $PROCESSED_COUNT"
              echo "Successful this call: $SUCCESS_COUNT"
              echo "Failed this call: $FAILED_COUNT"
              echo "Picked this call: $PICKED_COUNT"
              echo "Image progress: $COMPLETE_COUNT / $TOTAL_COUNT"
              echo "Still incomplete: $INCOMPLETE_COUNT"
              echo "Pending activities: $PENDING_COUNT"
              echo "Failed activities: $ACTIVITY_FAILED_COUNT"


              # =================================================
              # HUB COMPLETE
              # =================================================

              if [ "$HUB_COMPLETE" = "true" ]; then

                echo ""
                echo "========================================"
                echo "$TARGET_TIER REPAIR HUB COMPLETE"
                echo "$HUB_NAME"
                echo "$FACTORY_HUB_ID"
                echo "Images: $COMPLETE_COUNT / $TOTAL_COUNT"
                echo "========================================"

                break
              fi


              # =================================================
              # NO FURTHER PROGRESS POSSIBLE
              # =================================================

              if [ "$PICKED_COUNT" -eq 0 ] && \
                 [ "$PENDING_COUNT" -eq 0 ] && \
                 [ "$ACTIVITY_FAILED_COUNT" -gt 0 ]; then

                echo ""
                echo "Repair hub cannot make further progress."
                echo "All remaining activities are failed."
                echo "Factory hub: $FACTORY_HUB_ID"
                echo "Completed: $COMPLETE_COUNT / $TOTAL_COUNT"
                echo "Failed: $ACTIVITY_FAILED_COUNT"

                exit 1
              fi


              sleep "$PAUSE_SECONDS"

            done


            # ===================================================
            # HUB DID NOT FINISH
            # ===================================================

            if [ "$HUB_COMPLETE" != "true" ]; then

              echo ""
              echo "Repair hub did not complete within $MAX_CALLS_PER_HUB calls."
              echo "Hub: $HUB_NAME"
              echo "Factory hub ID: $FACTORY_HUB_ID"
              echo "Completed: $COMPLETE_COUNT / $TOTAL_COUNT"
              echo "Still incomplete: $INCOMPLETE_COUNT"
              echo "Next hub will NOT be claimed."

              exit 1
            fi


            # ===================================================
            # FIXED HUB MODE = ONE HUB ONLY
            # ===================================================

            if [ -n "$FIXED_FACTORY_HUB_ID" ]; then
              echo ""
              echo "Fixed repair hub completed."
              exit 0
            fi

          done
